name: Build PCB Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Android project
        run: |
          echo "Mencari ZIP project..."
          ls -la

          unzip -q PCB_Android_GitHub_Build_FIXED_UI.zip

          echo "ZIP berhasil diekstrak."
          echo "Isi folder project:"
          ls -la PCB_Android_Offline

      - name: Build APK
        working-directory: PCB_Android_Offline
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCB-Offline-APK-FIXED-UI
          path: PCB_Android_Offline/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
