name: Build PCB Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          echo "======================================"
          echo "Mencari ZIP project Android..."
          echo "======================================"

          ZIP="PCB_Android_GitHub_Build_FIXED_UI.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: File $ZIP tidak ditemukan!"
            echo "Isi repository:"
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          echo "Mengekstrak project..."
          unzip -o "$ZIP" -d extracted

          echo "======================================"
          echo "Isi hasil ekstraksi:"
          echo "======================================"

          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          echo "======================================"
          echo "Mencari settings.gradle..."
          echo "======================================"

          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            echo "Struktur folder:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Project Android ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Isi project:"
          echo "======================================"

          ls -la "$PROJECT_DIR"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILD APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "======================================"
          echo "Mencari APK hasil build..."
          echo "======================================"

          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCB-Offline-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
