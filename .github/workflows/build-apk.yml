name: Build PCB Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Mencari ZIP project Android..."
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'PCB_Android_GitHub_Build_FIXED_UI.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f -name 'PCB_Android_GitHub_Build_FIXED.zip' | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP yang digunakan:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Isi hasil ekstraksi:"
          find extracted -maxdepth 4 -type f | head -100

          echo ""
          echo "Mencari gradlew..."

          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan di dalam ZIP!"
            echo ""
            echo "Struktur ZIP:"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo ""
          echo "gradlew ditemukan:"
          echo "$GRADLEW"

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "Project:"
          echo "$PROJECT_DIR"
          echo "======================================"

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Mencari APK..."

          APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            find extracted -type f | tail -100
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/PCB-Offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCB-Offline-APK
          path: apk-output/PCB-Offline.apk
