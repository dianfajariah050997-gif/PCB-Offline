name: Build PCB Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Mencari ZIP project Android..."
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'PCB_Android_GitHub_Build_FIXED_UI.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 1 -type f \
              -name 'PCB_Android_GitHub_Build_FIXED.zip' | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project tidak ditemukan!"
            exit 1
          fi

          echo "ZIP yang digunakan:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Isi hasil ekstraksi:"
          find extracted -maxdepth 5 -type f

          PROJECT_DIR="extracted/PCB_Android_Offline"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERROR: build.gradle tidak ditemukan!"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: folder app tidak ditemukan!"
            exit 1
          fi

          echo ""
          echo "Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "BUILD APK"
          echo "Project: $PROJECT_DIR"
          echo "======================================"

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Mencari APK hasil build..."
          echo "======================================"

          APK=$(find extracted -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"

            echo ""
            echo "Isi folder project:"
            find extracted -type f

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/PCB-Offline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCB-Offline-APK
          path: apk-output/PCB-Offline.apk
